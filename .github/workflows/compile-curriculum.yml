name: Compile curriculum

on:
  pull_request:
    paths:
      - 'curriculum/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.cjs'
      - '.github/workflows/compile-curriculum.yml'
  push:
    branches:
      - main
    paths:
      - 'curriculum/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.cjs'
      - '.github/workflows/compile-curriculum.yml'

permissions:
  contents: read

jobs:
  compile:
    name: validate and compile curriculum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON schema
        run: npm run validate-schema

      - name: Run curriculum script tests
        run: npm test

      - name: Compile curriculum database
        run: COMPILE_OUTPUT_PATH=dist/curriculum.db npm run compile-curriculum

      - name: Upload compiled artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: curriculum-db
          path: dist/curriculum.db
          if-no-files-found: error

  generator-drift:
    name: generator reproduces committed JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: curriculum/_build/requirements.txt

      - name: Install generator dependencies
        run: pip install -r curriculum/_build/requirements.txt

      - name: Fetch furigana dataset
        run: curriculum/_build/fetch_furigana_dataset.sh

      # ladder.py is not run here: it reads KANJIDIC2 and KanjiVG, which are
      # not committed. _build/ladder.json is checked in (curriculum/README.md).
      # --report-pool until the ladder grammar content is in (level-ladder
      # plan, Task 7).
      - name: Regenerate curriculum JSON
        run: |
          python curriculum/_build/generate.py --report-pool
          python curriculum/_build/generate_deps.py

      # Fields authored only in the JSON (not in the _build datasets) are
      # optional in the schema, so dropping them still validates and compiles.
      # Regenerating in CI is what actually catches that.
      - name: Fail if regeneration changed committed JSON
        run: |
          if ! git diff --quiet -- curriculum; then
            echo "Regenerating from curriculum/_build produced a diff."
            echo "Either commit the regenerated JSON, or move the hand-edit into the _build datasets."
            git diff -- curriculum
            exit 1
          fi
