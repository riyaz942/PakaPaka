name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  curriculum:
    name: curriculum (validate, contrast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate curriculum schema
        run: npm run validate-schema

      - name: Check token contrast
        run: npm run check-contrast

      - name: Install Studio dependencies
        run: npm ci --prefix web

      - name: Test Studio server
        run: npm run test:studio

  mobile:
    name: mobile (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci
